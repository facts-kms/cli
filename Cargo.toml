[package]
name = "fact"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "fact"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
fact-canonical = { path = "../sdk/crates/fact-canonical" }
fact-commitment = { path = "../sdk/crates/fact-commitment" }
fact-crypto = { path = "../sdk/crates/fact-crypto" }
fact-store = { path = "../sdk/crates/fact-store" }
fact-sdk = { path = "../sdk/crates/fact-sdk" }
fact-core = { path = "../sdk/crates/fact-core" }
fact-schema = { path = "../sdk/crates/fact-schema" }
fact-search = { path = "../sdk/crates/fact-search" }
fact-http = { path = "../sdk/crates/fact-http" }
hex = "0.4"
uuid = { version = "1", features = ["v7", "serde"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
time = { version = "0.3", features = ["parsing", "formatting"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"
