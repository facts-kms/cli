name: Facts CLI

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  FACTS_SDK_REPOSITORY: https://github.com/facts-kms/sdk.git

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
          rustup component add rustfmt clippy
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: cli
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/cli"
      - name: Checkout Facts SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          git clone --depth 1 "$FACTS_SDK_REPOSITORY" "$GITHUB_WORKSPACE/sdk"
      - name: Check formatting
        working-directory: cli
        run: cargo fmt --check
      - name: Run clippy
        working-directory: cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Clean workspace
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/cli/target" "$GITHUB_WORKSPACE/.cargo" "$GITHUB_WORKSPACE/sdk"

  test:
    runs-on: ubuntu-latest
    container: rust:1.88-bookworm
    needs:
      - lint
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: cli
      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE/cli"
      - name: Checkout Facts SDK
        run: |
          rm -rf "$GITHUB_WORKSPACE/sdk"
          git clone --depth 1 "$FACTS_SDK_REPOSITORY" "$GITHUB_WORKSPACE/sdk"
      - name: Run tests
        working-directory: cli
        run: cargo test --locked
      - name: Clean workspace
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/cli/target" "$GITHUB_WORKSPACE/.cargo" "$GITHUB_WORKSPACE/sdk"
